# This workflow uses PyPI Trusted Publishing (OIDC) — no API token/password. It will
# FAIL until a trusted publisher for the `bioflow-py` project is registered on PyPI.
# `bioflow-py` does not exist on PyPI yet, so use the PENDING publisher form at
# https://pypi.org/manage/account/publishing/ (not the per-project form):
#   PyPI Project Name: bioflow-py
#   Owner:             DevinoSolutions
#   Repository name:   bioflow-python
#   Workflow name:     publish.yml
#   Environment name:  pypi
# The `pypi` environment must also exist in this repo (Settings -> Environments)
# or the OIDC claim will not match.
# Do NOT dispatch this workflow before that is done.
name: Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
