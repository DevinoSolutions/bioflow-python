name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: ty (type check)
        run: ty check

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Generated models match the vendored spec
        run: python scripts/regenerate.py --check
      - name: Vendored spec matches the live document
        # Advisory on pull requests (forks have no reason to resync the spec);
        # a hard gate on main, where a stale vendored spec is a real defect.
        continue-on-error: ${{ github.event_name != 'push' }}
        run: python scripts/regenerate.py --check-spec

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests --ignore=tests/e2e --cov=bioflow_py --cov-fail-under=90

  build-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test import
        run: |
          pip install dist/*.whl
          cd /tmp
          python -c "
          from bioflow_py import BioFlow, AsyncBioFlow, verify_webhook, OPERATIONS
          from bioflow_py.models import Page, FileObject
          import bioflow_py, importlib.resources
          assert len(OPERATIONS) == 22, OPERATIONS
          assert importlib.resources.files('bioflow_py').joinpath('py.typed').is_file()
          print('smoke ok', bioflow_py.__version__)
          "

  e2e-test:
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run prod smoke tests
        # Hits the real API at https://app.getbioflow.com with a read-only bf_test_
        # key. Skips loudly if the secret is absent (e.g. on forks).
        env:
          BIOFLOW_TEST_API_KEY: ${{ secrets.BIOFLOW_TEST_API_KEY }}
        run: pytest tests/e2e -v
