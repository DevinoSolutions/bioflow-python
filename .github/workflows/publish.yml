# This workflow uses PyPI Trusted Publishing (OIDC) — no API token/password.
#
# The trusted publisher is registered on PyPI as:
#   PyPI Project Name: bioflow-sdk      <- the DISTRIBUTION name; the import package
#                                          stays `bioflow_py`
#   Owner:             DevinoSolutions
#   Repository name:   bioflow-python
#   Workflow name:     publish.yml
#   Environment name:  (any)
# Any mismatch between those claims and this file fails the OIDC exchange with
# `invalid-publisher`. The `pypi` environment below is allowed because the publisher
# was registered without an environment restriction.
name: Publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
