name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format check)
        run: ruff format --check .
      - name: ty (type check)
        run: ty check

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Generated models match the vendored spec
        run: python scripts/regenerate.py --check
      - name: Vendored spec matches the live document
        # Advisory on pull requests (forks have no reason to resync the spec);
        # a hard gate on main, where a stale vendored spec is a real defect.
        continue-on-error: ${{ github.event_name != 'push' }}
        run: python scripts/regenerate.py --check-spec

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests --ignore=tests/e2e

  build-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test import
        run: |
          pip install dist/*.whl
          python -c "import bioflow_py; print(bioflow_py.__version__)"
