[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioflow-sdk"
dynamic = ["version"]
description = "Official Python SDK for the BioFlow public API (link-in-bio pages, contacts, files, analytics, webhooks)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devino Solutions Inc.", email = "support@getbioflow.com" }]
keywords = [
  "bioflow",
  "link-in-bio",
  "creator",
  "api",
  "sdk",
  "webhooks",
  "standard-webhooks",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://getbioflow.com"
Documentation = "https://getbioflow.com/docs/api/reference"
Repository = "https://github.com/DevinoSolutions/bioflow-python"
Issues = "https://github.com/DevinoSolutions/bioflow-python/issues"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-asyncio==1.3.0",
  "respx==0.23.1",
  "ruff==0.16.0",
  "ty==0.0.63",
  "datamodel-code-generator==0.72.1",
]

[tool.hatch.version]
path = "src/bioflow_py/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bioflow_py"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "openapi", "scripts", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["bioflow_py"]
omit = ["*/_generated/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/bioflow_py/_generated/**" = ["ALL"]

[tool.ruff.format]
exclude = ["src/bioflow_py/_generated/**"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]
